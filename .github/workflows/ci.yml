name: NinjaLibrary Continuous Integration

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'packaging/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'packaging/**'
      - 'LICENSE'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Compiler & System Dependencies (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgl1-mesa-dev \
          libpoppler-qt6-dev \
          tesseract-ocr \
          libtesseract-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-xkb1 \
          libegl1-mesa-dev \
            xvfb \
            openbox

    - name: Install Qt 6.8 Core Frameworks
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: ${{ matrix.os == 'ubuntu-24.04' && 'linux' || 'mac' }}
        target: 'desktop'
        modules: 'qt5compat qtshadertools qtimageformats'
        cache: true

    - name: Configure CMake & Activate Profiling Code Coverage
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_TESTING=ON \
          -DENABLE_COVERAGE=${{ matrix.os == 'ubuntu-24.04' && 'ON' || 'OFF' }}

    - name: Compile Application & Test Binaries
      run: cmake --build build

    - name: Execute Automated Unit & Integration Tests (CTest)
      run: |
        cd build
        if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
          xvfb-run -s "-screen 0 1024x768x24" bash -c "openbox & sleep 1 && ctest --output-on-failure --parallel 4"
        else
          ctest --output-on-failure --parallel 4
        fi

    - name: Generate Code Coverage Diagnostics Dashboard (Linux Only)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt-get install -y lcov
        lcov --directory . --capture --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/moc_*' '*/qrc_*' --output-file coverage.info
        lcov --list coverage.info

    - name: Package Release Binary (macOS)
      if: matrix.os == 'macos-14' && startsWith(github.ref, 'refs/tags/v')
      run: |
        cd build
        zip -r ../ninja-library-macos.zip NinjaLibrary.app

    - name: Package Release Binary (Linux)
      if: matrix.os == 'ubuntu-24.04' && startsWith(github.ref, 'refs/tags/v')
      run: |
        cd build
        zip -j ../ninja-library-linux.zip NinjaLibrary libNinjaLibrary.so 3rdparty/Kaakao/src/libKaakaoplugin.so || zip -j ../ninja-library-linux.zip NinjaLibrary libNinjaLibrary.so

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ninja-library-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
